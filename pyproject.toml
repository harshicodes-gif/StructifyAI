[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
explicit_package_bases = true
exclude = [
  "^.venv/",
  "^venv/",
  "^build/",
  "^dist/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=1"

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "tests/*",
  ".venv/*",
  "venv/*",
  "build/*",
  "dist/*",
]

[tool.coverage.report]
fail_under = 1
show_missing = true
skip_empty = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = []

[tool.pylint.main]
ignore = [".venv", "venv", "build", "dist"]
py-version = "3.11"

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-function-docstring",
  "missing-class-docstring",
]

[tool.vulture]
paths = ["app.py", "backend", "frontend"]
exclude = [".venv", "venv", "tests"]
min_confidence = 80
