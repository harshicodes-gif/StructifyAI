default:
  tags:
    - windows

stages:
  - install
  - format
  - lint
  - type_check
  - test
  - coverage
  - security
  - build

install_dependencies:
  stage: install
  script:
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt

lint_code:
  stage: lint
  script:
    - python -m pip install ruff
    - python -m ruff check .

format_code:
  stage: format
  script:
    - python -m pip install black ruff
    - python -m black --check .
    - python -m ruff format --check .

type_check:
  stage: type_check
  script:
    - python -m pip install -r requirements.txt
    - python -m mypy app.py backend frontend

test_code:
  stage: test
  script:
    - python -m pip install -r requirements.txt
    - python -m pytest

coverage:
  stage: coverage
  script:
    - python -m pip install -r requirements.txt
    - python -m pytest --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=1
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml

security_check:
  stage: security
  script:
    - python -m pip install bandit pip-audit
    - python -m bandit -r app.py backend frontend -x tests,.venv,venv
    - python -m pip_audit -r requirements.txt

secret_scan:
  stage: security
  script:
    - gitleaks detect --source . --redact --no-git
  allow_failure: true

build_check:
  stage: build
  script:
    - python -m compileall .
