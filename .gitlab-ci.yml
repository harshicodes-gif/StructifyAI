default:
  tags:
    - shared

stages:
  - install
  - lint
  - test
  - security
  - build

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

before_script:
  - python --version
  - python -m pip install --upgrade pip
  - python -m pip install -r requirements.txt

install_dependencies:
  stage: install
  script:
    - python -m pip list

lint_code:
  stage: lint
  script:
    - python -m pip install ruff
    - ruff check .

test_code:
  stage: test
  script:
    - python -m pip install pytest
    - pytest tests/

security_check:
  stage: security
  script:
    - python -m pip install bandit
    - bandit -r backend frontend app.py -x tests,.venv,venv

build_check:
  stage: build
  script:
    - python -m compileall .