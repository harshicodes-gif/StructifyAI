stages:
  - install
  - lint
  - test
  - security
  - build

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

install_dependencies:
  stage: install
  script:
    - |
      if command -v python3 >/dev/null 2>&1; then
        PYTHON=python3
      elif command -v python >/dev/null 2>&1; then
        PYTHON=python
      elif command -v py >/dev/null 2>&1; then
        PYTHON="py -3"
      else
        echo "Python not found!"
        exit 1
      fi
    - $PYTHON --version
    - $PYTHON -m pip install --upgrade pip
    - $PYTHON -m pip install -r requirements.txt

lint_code:
  stage: lint
  script:
    - $PYTHON -m pip install ruff
    - $PYTHON -m ruff check .

test_code:
  stage: test
  script:
    - $PYTHON -m pip install pytest
    - $PYTHON -m pytest

security_check:
  stage: security
  script:
    - $PYTHON -m pip install bandit
    - $PYTHON -m bandit -r app.py backend frontend -x tests,.venv,venv

build_check:
  stage: build
  script:
    - $PYTHON -m compileall .