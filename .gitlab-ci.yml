default:
  tags:
    - windows

stages:
  - install
  - lint
  - test
  - security
  - build

install_dependencies:
  stage: install
  script:
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt

lint_code:
  stage: lint
  script:
    - python -m pip install ruff
    - python -m ruff check .

test_code:
  stage: test
  script:
    - python -m pip install pytest
    - python -m pytest

security_check:
  stage: security
  script:
    - python -m pip install bandit
    - python -m bandit -r app.py backend frontend -x tests,.venv,venv

build_check:
  stage: build
  script:
    - python -m compileall .