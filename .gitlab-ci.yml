stages:
  - install
  - lint
  - test
  - security
  - build

.install_template:
  stage: install
  script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt

install_mac:
  extends: .install_template
  tags:
    - mac
  rules:
    - if: '$CI_COMMIT_BRANCH == "harshita"'

install_windows:
  extends: .install_template
  tags:
    - windows
  rules:
    - if: '$CI_COMMIT_BRANCH == "adwitha"'